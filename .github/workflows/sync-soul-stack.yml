name: Sync soul-stack templates

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch soul-stack templates
        run: |
          BASE="https://raw.githubusercontent.com/HoppyCat/soul-stack/refs/heads/main/soulmode-template"
          
          curl -sf "$BASE/on-load/AGENTS.md" -o on-load/AGENTS.md
          curl -sf "$BASE/on-load/CHANGELOG.md" -o on-load/CHANGELOG.md
          curl -sf "$BASE/on-load/HEURISTICS.md" -o on-load/HEURISTICS.md
          curl -sf "$BASE/on-load/INDEX.md" -o on-load/INDEX.md
          curl -sf "$BASE/on-load/KNOW.md" -o on-load/KNOW.md
          curl -sf "$BASE/on-load/MEMORY.md" -o on-load/MEMORY.md
          curl -sf "$BASE/on-load/SOUL.md" -o on-load/SOUL.md
          curl -sf "$BASE/on-load/STYLE.md" -o on-load/STYLE.md
          curl -sf "$BASE/on-load/USER.md" -o on-load/USER.md
          curl -sf "$BASE/on-load/WORKING_MEMORY.md" -o on-load/WORKING_MEMORY.md
          
          curl -sf "$BASE/on-demand/patches/PATCH_CHANGELOG.md" -o on-demand/patches/PATCH_CHANGELOG.md
          curl -sf "$BASE/on-demand/patches/PATCH_COURTIER.md" -o on-demand/patches/PATCH_COURTIER.md
          curl -sf "$BASE/on-demand/patches/PATCH_HUMANNESS.md" -o on-demand/patches/PATCH_HUMANNESS.md
          curl -sf "$BASE/on-demand/patches/PATCH_IMAGE_MEMORY.md" -o on-demand/patches/PATCH_IMAGE_MEMORY.md
          curl -sf "$BASE/on-demand/patches/PATCH_MEMORY_ARCHIVE.md" -o on-demand/patches/PATCH_MEMORY_ARCHIVE.md
          curl -sf "$BASE/on-demand/patches/PATCH_MOOD_SYSTEM.md" -o on-demand/patches/PATCH_MOOD_SYSTEM.md
          curl -sf "$BASE/on-demand/patches/PATCH_SKILL_FLOWS.md" -o on-demand/patches/PATCH_SKILL_FLOWS.md
          curl -sf "$BASE/on-demand/patches/PATCH_STORYTELLER_ENGINE.md" -o on-demand/patches/PATCH_STORYTELLER_ENGINE.md

      - name: Commit if anything changed
        run: |
          git config user.name "soul-stack-sync"
          git config user.email "sync@soulmode-agent"
          git add on-load/ on-demand/
          if git diff --staged --quiet; then
            echo "Already up to date."
          else
            git commit -m "sync: update templates from HoppyCat/soul-stack"
            git push
          fi
