name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - name: Deploy Worker
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Skip deploy when Cloudflare token is missing
        if: env.HAS_CLOUDFLARE_API_TOKEN != 'true'
        run: echo "::notice::Skipping Cloudflare deploy because CLOUDFLARE_API_TOKEN is not configured in repository secrets."
